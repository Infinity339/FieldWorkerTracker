name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libncurses-dev cmake libffi-dev libssl-dev cython3
        python3 -m pip install --upgrade pip
        pip install cython buildozer kivy==2.2.1 plyer requests pyjnius

    - name: Accept Android Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "8933bad161af4d29e4accdadc62424da6850fa41" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Build APK
      run: buildozer android debug 2>&1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-apk
        path: bin/*.apk
