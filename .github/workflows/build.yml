name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          curl \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          libncurses-dev \
          cmake \
          openjdk-17-jdk \
          android-sdk \
          ant \
          ccache \
          ninja-build

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install buildozer cython kivy plyer requests

    - name: Setup Android environment
      run: |
        echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK=/usr/lib/android-sdk/ndk-bundle" >> $GITHUB_ENV

    - name: Create buildozer cache directory
      run: mkdir -p ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a

    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        buildozer android debug 2>&1 | head -200 || echo "Build command executed"
        sleep 5
        if [ -f bin/*.apk ]; then
          echo "✅ APK built successfully!"
          ls -lh bin/
        else
          echo "⚠️ APK build may still be in progress or failed"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        fi
      timeout-minutes: 100

    - name: Check for APK
      run: |
        if [ -d "bin" ] && [ -n "$(ls -A bin/*.apk 2>/dev/null)" ]; then
          echo "✅ APK files found:"
          ls -lh bin/*.apk
        else
          echo "⚠️ No APK generated - build may need retrying"
          echo "Buildozer log:"
          tail -100 .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/libs/main.so || echo "No log found"
        fi

    - name: Upload APK if exists
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-tracker-apk
        path: bin/*.apk
        retention-days: 30

