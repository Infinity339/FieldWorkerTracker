name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          libncurses-dev cmake libffi-dev libssl-dev \
          cython3 ninja-build

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install cython==0.29.35
        python3 -m pip install buildozer==1.5.0
        python3 -m pip install kivy==2.2.1
        python3 -m pip install plyer requests pyjnius certifi

    - name: Verify Python environment
      run: |
        echo "=== Python Version ==="
        python3 --version
        echo "=== Pip Packages ==="
        pip list | grep -E "buildozer|kivy|cython"
        echo "=== Buildozer Info ==="
        buildozer --version
        which buildozer

    - name: Verify buildozer.spec
      run: |
        echo "=== buildozer.spec content ==="
        cat buildozer.spec
        echo "=== main.py first 50 lines ==="
        head -50 main.py

    - name: Build APK (VERBOSE OUTPUT)
      run: |
        echo "Starting buildozer build with verbose output..."
        buildozer android debug -v 2>&1 | tee build_output.log
        BUILD_EXIT_CODE=$?
        echo "Build exit code: $BUILD_EXIT_CODE"
        
    - name: Show build result
      if: always()
      run: |
        echo "=== Checking for APK ==="
        if [ -f "bin/fieldworkerlocationtracker-1.0-debug.apk" ]; then
          echo "✅ APK FOUND!"
          ls -lh bin/fieldworkerlocationtracker-1.0-debug.apk
        else
          echo "❌ APK NOT FOUND"
          echo ""
          echo "=== Last 300 lines of build log ==="
          tail -300 build_output.log
          echo ""
          echo "=== Searching for error messages ==="
          grep -i "error\|failed\|exception" build_output.log || echo "No explicit errors in log"
        fi

    - name: Upload APK or build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-tracker-build
        path: |
          bin/*.apk
          build_output.log
        if-no-files-found: warn

