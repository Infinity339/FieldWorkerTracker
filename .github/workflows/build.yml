name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libncurses-dev cmake libffi-dev libssl-dev cython3 ccache ninja-build wget curl
        python3 -m pip install --upgrade pip
        pip install cython
        pip install buildozer
        pip install kivy==2.2.1
        pip install plyer requests

    - name: Display buildozer version
      run: buildozer --version || echo "buildozer not ready yet"

    - name: Build APK with detailed output
      run: |
        echo "Starting APK build..."
        buildozer android debug 2>&1 | tee build.log
        echo "Build command completed"
        
        # Show final status
        if [ -f bin/fieldworkerlocationtracker-1.0-debug.apk ]; then
          echo "✅ SUCCESS: APK created!"
          ls -lh bin/*.apk
        else
          echo "⚠️ APK not found at expected location"
          echo "Searching for any APK files..."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log || echo "No build log"
        fi
      continue-on-error: true
      timeout-minutes: 150

    - name: Check for APK
      run: |
        echo "Checking for generated APK..."
        ls -la bin/ 2>/dev/null || echo "bin directory not found"
        find . -maxdepth 3 -name "*.apk" -type f 2>/dev/null || echo "No APK files in project"

    - name: Upload APK if found
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-tracker-apk
        path: bin/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Print build status
      if: always()
      run: |
        echo "=== Workflow Summary ==="
        if [ -f bin/fieldworkerlocationtracker-1.0-debug.apk ]; then
          echo "✅ BUILD SUCCESSFUL"
          ls -lh bin/fieldworkerlocationtracker-1.0-debug.apk
        else
          echo "❌ BUILD INCOMPLETE - APK NOT GENERATED"
          echo "Check the build log above for errors"
        fi

