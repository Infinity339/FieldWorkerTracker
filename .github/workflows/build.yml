name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libncurses-dev cmake libffi-dev libssl-dev cython3 ninja-build
        python3 -m pip install --upgrade pip
        pip install cython==0.29.35 buildozer==1.5.0 kivy==2.2.1 plyer requests pyjnius certifi

    - name: Build APK
      run: buildozer android debug 2>&1

    - name: Show result
      if: always()
      run: |
        if [ -f "bin/fieldworkerlocationtracker-1.0-debug.apk" ]; then
          echo "✅ SUCCESS - APK CREATED!"
          ls -lh bin/*.apk
        else
          echo "❌ APK not found - checking for errors..."
          find . -name "*.apk" 2>/dev/null || echo "No APK files"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-tracker-apk
        path: bin/*.apk
        if-no-files-found: warn

