name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config libncurses-dev cmake libffi-dev libssl-dev cython3 ninja-build

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip
        pip install cython==0.29.35 buildozer==1.5.0 kivy==2.2.1 plyer requests pyjnius certifi

    - name: Setup Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo "d56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_HOME/licenses/google-android-sdk-license
        echo "Licenses created successfully"
        ls -la $ANDROID_HOME/licenses/

    - name: Build APK
      run: |
        echo "=== Starting Build ==="
        buildozer android debug 2>&1
        echo "=== Build Complete ==="

    - name: Check APK
      if: always()
      run: |
        echo "=== Checking for APK ==="
        if [ -f "bin/fieldworkerlocationtracker-1.0-debug.apk" ]; then
          echo "✅ APK CREATED!"
          ls -lh bin/fieldworkerlocationtracker-1.0-debug.apk
        else
          echo "❌ APK not found"
          ls -la bin/ 2>/dev/null || echo "bin folder does not exist"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fieldworker-tracker-apk
        path: bin/*.apk
        if-no-files-found: warn

