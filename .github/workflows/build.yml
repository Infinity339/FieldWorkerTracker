name: Build Worker Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install all dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          libncurses-dev cmake libffi-dev libssl-dev cython3 ninja-build
        python3 -m pip install --upgrade pip
        pip install cython buildozer kivy plyer requests pyjnius

    - name: Accept Android Licenses (Correct Method)
      run: |
        export ANDROID_SDK_HOME=$ANDROID_HOME
        mkdir -p ~/.android
        # Create the exact license hash files that Android SDK expects
        mkdir -p $ANDROID_HOME/licenses
        {
          echo "8933bad161af4d29e4accdadc62424da6850fa41"
          echo ""
        } > $ANDROID_HOME/licenses/android-sdk-license
        {
          echo "84831b9409646a918e30573bab4c9c91346d8abd"
          echo ""
        } > $ANDROID_HOME/licenses/android-sdk-preview-license
        ls -la $ANDROID_HOME/licenses/

    - name: Run Buildozer
      env:
        ACCEPT_SDK_LICENSE: 'yes'
      run: |
        buildozer android debug 2>&1 | tee build.log
        BUILD_EXIT=$?
        echo "Build exit code: $BUILD_EXIT"

    - name: Check for APK
      run: |
        if [ -f "bin/fieldworkerlocationtracker-1.0-debug.apk" ]; then
          echo "✅ SUCCESS!"
          ls -lh bin/*.apk
          exit 0
        else
          echo "❌ FAILED"
          echo "Looking for APK..."
          find . -name "*.apk" 2>/dev/null || echo "Not found"
          echo ""
          echo "Last 100 lines of build log:"
          tail -100 build.log || echo "No log"
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fieldworker-tracker-apk
        path: bin/*.apk

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log

